version: 2

project_name: dnser

before:
  hooks:
    - go mod tidy
    - mkdir -p packaging/man
    - sh -c "go run ./cmd/dnser man | gzip -9 > packaging/man/dnser.1.gz"

builds:
  - id: dnser
    main: ./cmd/dnser
    binary: dnser
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/SDK-E/dnser/internal/buildinfo.version={{ .Version }}

checksum:
  name_template: checksums.txt

release:
  github:
    owner: SDK-E
    name: dnser

homebrew_casks:
  - name: dnser
    repository:
      owner: SDK-E
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/SDK-E/dnser
    description: Local domains, TLS and dev-server orchestration
    license: BUSL-1.1
    binaries:
      - dnser
    dependencies:
      - formula: caddy
      - formula: mkcert
      - formula: f1bonacc1/tap/process-compose
    manpages:
      - packaging/man/dnser.1.gz
    zap:
      delete:
        - ~/.dnser
      launchctl:
        - enterprises.sdk.dnser

nfpms:
  - id: dnser
    package_name: dnser
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/SDK-E/dnser
    maintainer: SDK-E <hicham@sdk.enterprises>
    description: |-
      Local domains, TLS and dev-server orchestration.
      dnser manages project manifests, DNS, TLS and supervised dev servers.
    license: BUSL-1.1
    formats:
      - deb
      - rpm
    dependencies:
      - caddy
      - process-compose
      - mkcert
    contents:
      - src: packaging/man/dnser.1.gz
        dst: /usr/share/man/man1/dnser.1.gz
