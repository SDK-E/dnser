log_level: info
processes:
    auth:
        availability:
            restart: on_failure
        command: npm run dev -- --port 3000
        environment:
            - DNSER_DOMAIN=app.acme.io
            - PORT=3000
        log_location: /home/dev/.dnser/logs/auth/auth.log
        readiness_probe:
            exec:
                command: nc -z 127.0.0.1 3000
            period_seconds: 2
        shutdown:
            signal: 15
            timeout_seconds: 10
        working_dir: testdata/fixture-root
version: "0.5"
