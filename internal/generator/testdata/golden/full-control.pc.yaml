log_level: info
processes:
    auth:
        availability:
            restart: always
        command: bin/serve
        environment:
            - DNSER_DOMAIN=app.acme.io
            - PORT=3000
        log_location: /home/dev/.dnser/logs/auth/auth.log
        shutdown:
            signal: 15
            timeout_seconds: 15
        working_dir: testdata/fixture-root
version: "0.5"
