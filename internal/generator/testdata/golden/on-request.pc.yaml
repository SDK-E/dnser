log_level: info
processes:
    auth:
        availability:
            restart: 'no'
        command: bin/serve
        disabled: true
        environment:
            - DNSER_DOMAIN=sleepy.acme.io
            - PORT=3000
        log_location: /home/dev/.dnser/logs/auth/auth.log
        readiness_probe:
            exec:
                command: nc -z 127.0.0.1 3000
            period_seconds: 2
        shutdown:
            signal: 15
            timeout_seconds: 10
        working_dir: testdata/fixture-root
version: "0.5"
