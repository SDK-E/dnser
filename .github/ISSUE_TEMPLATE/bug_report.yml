name: Bug report
description: Something in dnser is broken or behaving against the docs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: run `dnser doctor` — many issues come with an exact
        fix printed there. Security vulnerabilities do NOT belong here;
        use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Observed vs expected behavior. Include exact command and output.
      placeholder: |
        $ dnser start demo
        ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps from a clean state, including manifest contents.
      placeholder: |
        dnser init static
        dnser link .
        dnser up
        ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: dnser doctor output
      description: Preferably `dnser doctor -o json` (redact secrets).
      render: text
  - type: input
    id: version
    attributes:
      label: dnser version
      description: Output of `dnser --version`
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Homebrew cask
        - deb/rpm release
        - go install from source
        - other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (deb-based)
        - Linux (rpm-based)
        - Windows
        - other
    validations:
      required: true
  - type: checkboxes
    id: invariant
    attributes:
      label: Impact on normal browsing
      description: "Unhandled queries must forward upstream — if regular DNS browsing broke because of dnser, tick this; it raises priority."
      options:
        - label: Regular internet browsing/DNS was affected by this bug
