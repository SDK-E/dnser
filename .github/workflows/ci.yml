name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: regenerate schemas and diff against committed
        run: |
          set -euo pipefail
          go run ./cmd/dnser schema > /tmp/dnser.manifest.schema.json
          if ! diff -u internal/config/schema/dnser.manifest.schema.json /tmp/dnser.manifest.schema.json; then
            echo "::error::Generated schema drifted from internal/config/schema/dnser.manifest.schema.json"
            echo "Regenerate locally: go run ./cmd/dnser schema > internal/config/schema/dnser.manifest.schema.json"
            exit 1
          fi

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: build dashboard and diff committed dist
        run: |
          set -euo pipefail
          cd internal/dashboard/webapp
          npm ci --no-fund --no-audit
          npm run build
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- internal/dashboard/webapp/dist; then
            echo "::error::Committed dist drifted from sources"
            echo "Rebuild locally: (cd internal/dashboard/webapp && npm run build)"
            exit 1
          fi
