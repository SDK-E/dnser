name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
      - name: Build UI
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        run: golangci-lint run

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build
      - run: GOOS=${{ matrix.goos }} go build -o /dev/null ./cmd/dnser

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build UI (embedded assets)
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build
      - name: End-to-end tests (real binary, real ports)
        run: go test ./internal/e2e/ -count=1 -v -timeout 10m

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build UI
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build
      - name: Desktop unit tests
        run: go test -tags "desktop,gtk3" ./internal/desktop/ ./internal/setup/ -count=1 -race
      - name: Desktop build
        run: go build -tags "desktop,gtk3" ./cmd/dnser-desktop
      - name: Vet desktop sources
        run: go vet -tags "desktop,gtk3" ./internal/desktop/ ./internal/setup/ ./cmd/dnser-desktop
