name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli-archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: 2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: ./scripts/package/macos.sh "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: choco install nsis -y --no-progress
      - run: ./scripts/package/windows.sh "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/DNSer_*_windows_*.exe
          if-no-files-found: error

  linux-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            appimage: true
          - runner: ubuntu-24.04-arm
            arch: arm64
            appimage: false
    runs-on: ${{ matrix.runner }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev >/dev/null
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - if: matrix.appimage
        run: |
          mkdir -p dist
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O dist/appimagetool
          chmod +x dist/appimagetool
      - run: ./scripts/package/linux.sh "${GITHUB_REF_NAME#v}" dist ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  attach-installers:
    needs: [cli-archives, macos-dmg, windows-installer, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/installers
          merge-multiple: true
      - name: checksums + attach to release
        run: |
          cd dist/installers
          sha256sum ./*.dmg ./*.exe ./*.deb ./*.rpm ./*.AppImage > DNSer_installers_checksums.txt
          gh release upload "$GITHUB_REF_NAME" DNSer_installers_checksums.txt ./*.dmg ./*.exe ./*.deb ./*.rpm ./*.AppImage --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew-tap:
    needs: [cli-archives, attach-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: push formula + cask update (requires HOMEBREW_TAP_REPO and HOMEBREW_TOKEN)
        if: vars.HOMEBREW_TAP_REPO != ''
        run: ./scripts/channels/homebrew.sh
        env:
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}

  aur-publish:
    needs: [attach-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: update AUR packages (requires AUR_SSH_KEY)
        if: vars.AUR_ENABLE == '1'
        run: ./scripts/channels/aur.sh
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

  winget-submit:
    needs: [attach-installers]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: submit winget manifest PR (requires WINGET_TOKEN; package must be registered once manually)
        if: vars.WINGET_PACKAGE_ID != ''
        run: ./scripts/channels/winget.sh
        env:
          WINGET_PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
