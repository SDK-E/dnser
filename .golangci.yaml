version: "2"

run:
  timeout: 5m

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*bytes.Buffer).Write
        - (*strings.Builder).WriteString

formatters:
  default:
    - gofmt
